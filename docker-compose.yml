services:
  builder:
    container_name: blog_common
    build:
      dockerfile: ./configs/docker/builder.dockerfile
  #================================================
  db:
    container_name: blog_postgres
    image: postgres:latest
    env_file:
      - .env
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.50'
        reservations:
          memory: 256M
    restart: unless-stopped
  #================================================
  server:
    container_name: blog_server
    build:
      dockerfile: ./configs/docker/server.dockerfile
      additional_contexts:
        builder: service:builder
    depends_on:
      builder:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        restart: true
    ports:
      - "${SERVER_HTTP_PORT}:${SERVER_HTTP_PORT}"
      - "${SERVER_GRPC_PORT}:${SERVER_GRPC_PORT}"
    environment:
      - DOCKER_CONTAINER=true
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "./configs/scripts/server-healthcheck.sh" ]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.50'
        reservations:
          memory: 256M
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  #================================================
  web-server:
    container_name: blog_web_server
    build:
      dockerfile: ./configs/docker/web-server.dockerfile
      additional_contexts:
        builder: service:builder
    depends_on:
      builder:
        condition: service_completed_successfully
      server:
        condition: service_healthy
        restart: true
    ports:
      - "${WEB_SERVER_HTTP_PORT}:${NGINX_HTTP_PORT}"
      - "${WEB_SERVER_HTTPS_PORT}:${NGINX_HTTPS_PORT}"
    env_file:
      - ./modules/blog-fe/.env #replace with local .env
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: curl -f https://localhost:${WEB_SERVER_HTTPS_PORT} || exit 1
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.50'
        reservations:
          memory: 256M
    restart: unless-stopped